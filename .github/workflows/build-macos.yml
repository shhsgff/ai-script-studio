name: 构建 macOS 安装包

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    # 项目没有原生依赖，任意 macOS runner 都能同时产出 x64 与 arm64 包
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 确认 Electron 二进制
        run: |
          if [ ! -d node_modules/electron/dist ]; then node node_modules/electron/install.js; fi

      # build/icon.png 在 .gitignore 里（本地生成），CI 需要重新生成一次，否则会退回 Electron 默认图标
      - name: 生成应用图标
        run: node scripts/make-icon.js

      - name: 打包 macOS（universal dmg，Intel + Apple Silicon 通用）
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build:mac

      - name: 列出产物
        run: ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: jianxing-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error
