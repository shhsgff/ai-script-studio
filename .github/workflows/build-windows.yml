name: 构建 Windows 安装包

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      # npm 11 可能拦掉 postinstall，导致 Electron 二进制没下载，这里兜底补一次
      - name: 确认 Electron 二进制
        shell: pwsh
        run: |
          if (-not (Test-Path node_modules\electron\dist\electron.exe)) {
            node node_modules/electron/install.js
          }

      - name: 冒烟自测（205 条断言）
        shell: pwsh
        run: |
          $env:SMOKE_OUT = "smoke-out.txt"
          & node_modules\electron\dist\electron.exe . --smoke
          if ($LASTEXITCODE -ne 0) { Get-Content smoke-out.txt; exit 1 }
          Get-Content smoke-out.txt | Select-Object -Last 3

      - name: 打包
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: jianxing-windows-x64
          path: |
            dist/*.exe
          if-no-files-found: error
